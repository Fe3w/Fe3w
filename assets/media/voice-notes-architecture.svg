<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 486' width='960' height='486' role='img'>
<title>AI research agent and voice notes: architecture</title><desc>The Android app records voice notes offline, encrypts each object with AES-256-GCM and uploads it to a hidden Google Drive app folder used as a serverless mailbox. The laptop runs speech-to-text and a local LLM on one 8 GB GPU, checks that every extracted item quotes the transcript, and writes workspace pages. If a note asks for something, a request check, a plan approved on the phone and a planner, executor, reader and writer agent produce a cited report. Results, plans and reports sync back to the phone.</desc>
