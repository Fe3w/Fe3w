<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 486' width='960' height='486' role='img'>
<title>Vision-Language-Action pipeline architecture</title><desc>A plain-English task and an overhead image with numbered object tags go to a local VLM, distilled from larger models with LoRA, which picks the target, reference and relation. Up to 4 model providers must agree. Camera rays turn the tags into 3D targets, motion planning finds an obstacle-aware path, and NVIDIA Isaac Sim runs and checks it. On the real arm, a phone camera calibrated with ArUco markers mirrors the table into the simulation, the table is re-scanned before execution, and a serial bridge sends checked moves to the Dobot Magician.</desc>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker></defs>
<rect x='0.5' y='0.5' width='959' height='485' rx='10' fill='#fcfcfb' stroke='#e3e3e1'/>
<text x='28' y='40' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='18' font-weight='600' fill='#0b0b0b'>Vision-Language-Action (VLA) pipeline: decide, check in simulation, run on the real arm</text>
<text x='932' y='72' text-anchor='end' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='11' font-weight='600' letter-spacing='1' fill='#8a939e'>1 · DECIDE</text>
<text x='826' y='212' text-anchor='end' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='11' font-weight='600' letter-spacing='1' fill='#8a939e'>2 · PLAN AND CHECK IN SIMULATION</text>
<text x='932' y='352' text-anchor='end' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='11' font-weight='600' letter-spacing='1' fill='#8a939e'>3 · RUN ON THE REAL ARM</text>
<rect x='30' y='82' width='200' height='80' rx='8' fill='#ffffff' stroke='#c9ced6' stroke-width='1.5'/>
<text x='130.0' y='112' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='15' font-weight='600' fill='#0b0b0b'>Task in plain English</text>
<text x='130.0' y='132' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#52606d'>“place the green cube</text>
<text x='130.0' y='148' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#52606d'>next to the cylinder”</text>
<rect x='270' y='82' width='200' height='80' rx='8' fill='#ffffff' stroke='#c9ced6' stroke-width='1.5'/>
<text x='370.0' y='112' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='15' font-weight='600' fill='#0b0b0b'>Overhead camera image</text>
<text x='370.0' y='132' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#52606d'>every object gets a</text>
<text x='370.0' y='148' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#52606d'>numbered tag</text>
<rect x='510' y='82' width='200' height='80' rx='8' fill='#e8f3f6' stroke='#0b6e8a' stroke-width='1.5'/>
<text x='610.0' y='112' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='15' font-weight='600' fill='#0b0b0b'>Local VLM</text>
<text x='610.0' y='132' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#2f4b57'>distilled with LoRA, picks</text>
<text x='610.0' y='148' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#2f4b57'>target, reference, relation</text>
<rect x='750' y='82' width='180' height='80' rx='8' fill='#ffffff' stroke='#c9ced6' stroke-width='1.5'/>
<text x='840.0' y='112' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='15' font-weight='600' fill='#0b0b0b'>Consensus check</text>
<text x='840.0' y='132' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#52606d'>up to 4 model providers</text>
<text x='840.0' y='148' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#52606d'>must agree</text>
