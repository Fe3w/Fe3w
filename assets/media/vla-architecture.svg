<text x='370.0' y='416' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#52606d'>refuse if anything moved</text>
<rect x='510' y='362' width='200' height='80' rx='8' fill='#ffffff' stroke='#c9ced6' stroke-width='1.5'/>
<text x='610.0' y='396' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='15' font-weight='600' fill='#0b0b0b'>Serial bridge</text>
<text x='610.0' y='416' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#52606d'>checked moves + suction</text>
<rect x='750' y='362' width='180' height='80' rx='8' fill='#1f2933' stroke='#1f2933' stroke-width='1.5'/>
<text x='840.0' y='392' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='15' font-weight='600' fill='#ffffff'>Dobot Magician</text>
