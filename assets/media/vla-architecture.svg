<text x='130.0' y='392' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='15' font-weight='600' fill='#0b0b0b'>Phone camera + ArUco</text>
<text x='130.0' y='412' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#52606d'>real table mapped to</text>
<text x='130.0' y='428' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#52606d'>robot millimetres</text>
<rect x='270' y='362' width='200' height='80' rx='8' fill='#ffffff' stroke='#c9ced6' stroke-width='1.5'/>
