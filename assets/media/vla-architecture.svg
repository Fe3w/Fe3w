<text x='840.0' y='276' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#52606d'>tags become 3D targets</text>
<rect x='510' y='222' width='200' height='80' rx='8' fill='#ffffff' stroke='#c9ced6' stroke-width='1.5'/>
<text x='610.0' y='252' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='15' font-weight='600' fill='#0b0b0b'>Motion planning</text>
<text x='610.0' y='272' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#52606d'>inverse kinematics +</text>
<text x='610.0' y='288' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#52606d'>obstacle-aware route</text>
<rect x='270' y='222' width='200' height='80' rx='8' fill='#e8f3f6' stroke='#0b6e8a' stroke-width='1.5'/>
<text x='370.0' y='252' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='15' font-weight='600' fill='#0b0b0b'>NVIDIA Isaac Sim</text>
<text x='370.0' y='272' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#2f4b57'>simulated run +</text>
<text x='370.0' y='288' text-anchor='middle' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' fill='#2f4b57'>automatic result check</text>
